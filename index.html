<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Architekt & Meister</title>
    <meta name="description" content="Handgefertigte Massivholzmöbel aus deutscher Eiche – entworfen von einem Architekten, gebaut von einem Meister. Stücke, die länger leben als das Holz, aus dem sie gemacht sind." />
    <link rel="canonical" href="https://architektundmeister.de/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Architekt & Meister" />
    <meta property="og:title" content="Architekt & Meister – Handgefertigte Massivholzmöbel" />
    <meta property="og:description" content="Handgefertigte Massivholzmöbel aus deutscher Eiche – entworfen von einem Architekten, gebaut von einem Meister. Stücke, die länger leben als das Holz, aus dem sie gemacht sind." />
    <meta property="og:image" content="https://architektundmeister.de/images/echtholzbett_2.png" />
    <meta property="og:url" content="https://architektundmeister.de/" />
    <meta name="twitter:card" content="summary_large_image" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Space Grotesk for that architectural/technical header feel, Inter for body readability -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
            },
            colors: {
              'am-black': '#111111',
              'am-offwhite': '#f9f9f9',
              'am-gray': '#e5e5e5',
              'am-accent': '#111111', /* Changed from blue to black for monochrome look */
            },
            fontSize: {
              'huge': 'clamp(3rem, 8vw, 10rem)',
              'big': 'clamp(2rem, 5vw, 6rem)',
            }
          }
        }
      }
    </script>
    <style>
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #f9f9f9;
        overflow-x: hidden;
      }
      /* Hide scrollbar for clean look */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      /* Smooth selection */
      ::selection {
        background-color: #111111;
        color: #ffffff;
      }

      /* Respect OS-level reduced motion for plain CSS transitions/animations
         (Framer Motion animations are handled separately via MotionConfig) */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
</head>
  <body class="bg-am-offwhite text-am-black font-sans">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
